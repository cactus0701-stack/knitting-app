<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あみもの帳</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#3b3530;--accent:#b5746a;--line:#e6dfd6;--muted:#8a8178}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1f1c1a;--card:#2a2623;--ink:#f1ebe4;--accent:#c98a80;--line:#3d3834;--muted:#a39a90}}
:root[data-theme="dark"]{--bg:#1f1c1a;--card:#2a2623;--ink:#f1ebe4;--accent:#c98a80;--line:#3d3834;--muted:#a39a90}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{position:sticky;top:0;z-index:1;background:var(--accent);color:#fff;padding:12px 16px;font-weight:600}
nav{position:sticky;top:44px;z-index:1;display:flex;gap:4px;padding:8px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;min-width:0;padding:10px 4px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:15px}
nav button.on{background:var(--accent);color:#fff}
main{padding:16px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;font-size:14px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;margin:4px 0 10px;font-family:inherit}
button{font-family:inherit}
button.p{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
button.s{background:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button.d{color:#c0392b;background:none;border:0;padding:6px;font-size:14px;cursor:pointer}
.muted{color:var(--muted);font-size:13px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
h2{font-size:18px;margin:6px 0 10px}
</style>
</head>
<body>
<header>あみもの帳</header>
<nav>
  <button data-tab="stock" onclick="go('stock')">在庫</button>
  <button data-tab="projects" onclick="go('projects')">作品</button>
  <button data-tab="patterns" onclick="go('patterns')">編み図</button>
  <button data-tab="suggest" onclick="go('suggest')">おすすめ</button>
</nav>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const KEY = 'knit-app-v1';
const WEIGHTS = ['極細', '中細', '合太', '並太', '極太', '超極太', 'その他'];

function loadDb(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
let db = { yarns: [], projects: [], patterns: [], ...loadDb() };

function saveDb(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { alert('保存に失敗しました。写真が多いと容量オーバーになることがあります。写真を減らしてください。'); }
}

const $ = id => document.getElementById(id);
const val = id => $(id).value.trim();
const num = id => Math.max(0, Number($(id).value) || 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts = (list, sel) => list.map(o => `<option value="${esc(o)}" ${o === sel ? 'selected' : ''}>${esc(o)}</option>`).join('');
const yarnName = id => { const y = db.yarns.find(y => y.id === id); return y ? `${y.name}${y.color ? ' ' + y.color : ''}` : '（削除済み）'; };
const curProject = () => db.projects.find(p => p.id === current);
const restore = u => { const y = db.yarns.find(y => y.id === u.yarnId); if (y) { y.skeins += u.skeins; y.meters += u.meters; } };

let tab = 'stock', current = null, zxReader = null, patQuery = '';

function go(t, id){
  stopScan();
  tab = t;
  current = id || null;
  render();
  window.scrollTo(0, 0);
}
function stopScan(){
  if (zxReader) { zxReader.reset(); zxReader = null; }
  if ($('scan')) $('scan').innerHTML = '';
}
function render(){
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === tab || (tab === 'detail' && b.dataset.tab === 'projects')));
  const views = { stock: viewStock, projects: viewProjects, detail: viewDetail, patterns: viewPatterns, suggest: viewSuggest };
  $('main').innerHTML = views[tab]();
}

/* ---------- 在庫 ---------- */
function viewStock(){
  return `
  <div class="card">
    <h2>毛糸を追加</h2>
    <div class="row"><button class="p" onclick="scanJan()">📷 バーコードを読み取る</button></div>
    <div id="scan"></div>
    <label>JANコード（読めない場合は手入力）</label>
    <div class="row"><input id="y_jan" inputmode="numeric" placeholder="4901234567890" style="flex:1"
      onchange="lookupJan()"><button class="s" onclick="lookupJan()">商品名を調べる</button></div>
    <p id="y_lookup" class="muted"></p>
    <label>商品名</label>
    <input id="y_name">
    <label>色・色番</label>
    <input id="y_color">
    <label>太さ</label>
    <select id="y_weight">${opts(WEIGHTS)}</select>
    <div class="row">
      <label style="flex:1">1玉のm数<input id="y_m" type="number" min="0"></label>
      <label style="flex:1">在庫の玉数<input id="y_n" type="number" min="0" value="1"></label>
    </div>
    <button class="p" onclick="addYarn()">在庫に追加</button>
  </div>
  <div class="card">
    <label>楽天アプリID（商品名の自動表示に使います。一度入力すると保存されます）</label>
    <input id="rk_id" value="${esc(localStorage.getItem('knit-rakuten-id') || '')}"
      onchange="localStorage.setItem('knit-rakuten-id', this.value.trim())">
    <label>楽天アクセスキー（楽天の登録画面に表示されていれば入力します）</label>
    <input id="rk_key" value="${esc(localStorage.getItem('knit-rakuten-key') || '')}"
      onchange="localStorage.setItem('knit-rakuten-key', this.value.trim())">
  </div>
  <h2>在庫（${db.yarns.length}件）</h2>
  ${db.yarns.map(yarnCard).join('') || '<p class="muted">まだ毛糸がありません</p>'}`;
}

function yarnCard(y){
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <div><strong>${esc(y.name)}</strong> <span class="muted">${esc(y.weight)}${y.color ? ' ・ ' + esc(y.color) : ''}</span><br>
      <span class="muted">JAN ${esc(y.jan || '未登録')}</span></div>
      <button class="d" onclick="delYarn('${y.id}')">削除</button>
    </div>
    <p>在庫：<strong>${y.skeins}玉</strong>（残り ${y.meters}m ／ 1玉 ${y.mPerSkein}m）</p>
    <div class="row">
      <button class="s" onclick="adjust('${y.id}', -1)">−1玉</button>
      <button class="s" onclick="adjust('${y.id}', 1)">+1玉</button>
      <button class="s" onclick="editMeters('${y.id}')">m数を修正</button>
    </div>
  </div>`;
}

// ZXing（JavaScript版）で読み取るため、iPhoneのSafariでも動作する
function scanJan(){
  const box = $('scan');
  if (typeof ZXing === 'undefined') {
    box.innerHTML = '<p class="muted">読み取り部品を読み込めませんでした。通信状態を確認するか、JANコードを手入力してください。</p>';
    return;
  }
  stopScan();
  box.innerHTML = `<video id="cam" playsinline muted style="width:100%;border-radius:8px"></video>
    <p class="muted">バーコードを枠内に写してください</p>
    <button class="s" onclick="stopScan()">読み取りをやめる</button>`;
  zxReader = new ZXing.BrowserMultiFormatReader();
  zxReader.decodeFromConstraints({ video: { facingMode: 'environment' } }, 'cam', (result) => {
    if (!result) return;
    const code = result.getText();
    stopScan();
    $('y_jan').value = code;
    lookupJan();
  }).catch(e => {
    box.innerHTML = `<p class="muted">カメラを使えませんでした（${esc(e.message)}）。手入力してください。</p>`;
  });
}

// 楽天商品検索APIでJANコードから商品名を取得する（アプリIDは設定欄に入力）
async function lookupJan(){
  const jan = val('y_jan');
  const msg = $('y_lookup');
  const appId = localStorage.getItem('knit-rakuten-id') || '';
  const accessKey = localStorage.getItem('knit-rakuten-key') || '';
  if (!/^\d{13}$/.test(jan)) { msg.textContent = 'JANコードは13桁の数字で入力してください'; return; }
  if (!appId) { msg.textContent = '下の「楽天アプリID」を入力すると、商品名を自動で表示できます'; return; }
  msg.textContent = '商品名を検索中…';
  try {
    const url = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20220601'
      + `?applicationId=${encodeURIComponent(appId)}&jancode=${jan}&format=json`
      + (accessKey ? `&accessKey=${encodeURIComponent(accessKey)}` : '');
    const res = await fetch(url, { headers: { Referer: location.href } });
    const json = await res.json();
    if (json.errors || json.error) {
      const e = json.errors || json.error;
      msg.textContent = `楽天からエラー：${e.errorMessage || e.error_description || e.error || e}`;
      return;
    }
    const item = json.Items?.[0]?.Item;
    if (!item) { msg.textContent = '商品が見つかりませんでした。商品名は手で入力してください'; return; }
    if (!val('y_name')) $('y_name').value = item.itemName;
    msg.textContent = '商品名を入れました（違う場合は修正できます）';
  } catch (e) {
    msg.textContent = `検索に失敗しました（${e.message}）。商品名は手で入力してください`;
  }
}

function addYarn(){
  const name = val('y_name');
  if (!name) { alert('商品名を入力してください'); return; }
  const n = num('y_n'), m = num('y_m');
  db.yarns.push({ id: uid(), jan: val('y_jan'), name, color: val('y_color'), weight: val('y_weight'),
    mPerSkein: m, skeins: n, meters: n * m });
  saveDb();
  render();
}
function adjust(id, d){
  const y = db.yarns.find(y => y.id === id);
  y.skeins = Math.max(0, y.skeins + d);
  y.meters = Math.max(0, y.meters + d * y.mPerSkein);
  saveDb();
  render();
}
function editMeters(id){
  const y = db.yarns.find(y => y.id === id);
  const m = prompt('残りのm数を入力', y.meters);
  if (m === null) return;
  y.meters = Math.max(0, Number(m) || 0);
  saveDb();
  render();
}
function delYarn(id){
  if (!confirm('この毛糸を在庫から削除しますか？（作品の使用記録は残ります）')) return;
  db.yarns = db.yarns.filter(y => y.id !== id);
  saveDb();
  render();
}

/* ---------- 作品 ---------- */
function viewProjects(){
  return `
  <div class="card">
    <h2>新しい作品</h2>
    <input id="p_title" placeholder="作品名（例：ミニ巾着）">
    <button class="p" onclick="addProject()">作品を登録</button>
  </div>
  <h2>作品（${db.projects.length}件）</h2>
  ${db.projects.map(p => `<div class="card row" style="cursor:pointer" onclick="go('detail','${p.id}')">
      ${p.photo ? `<img class="thumb" src="${p.photo}" alt="">` : '<div class="thumb"></div>'}
      <div><strong>${esc(p.title)}</strong><br><span class="muted">使用毛糸 ${p.usage.length}件 ・ ${esc(p.date)}</span></div>
    </div>`).join('') || '<p class="muted">まだ作品がありません</p>'}`;
}
function addProject(){
  const title = val('p_title');
  if (!title) { alert('作品名を入力してください'); return; }
  const p = { id: uid(), title, date: new Date().toISOString().slice(0, 10), photo: '', patternImg: '',
    patternId: '', method: '', points: '', url: '', book: '', usage: [] };
  db.projects.push(p);
  saveDb();
  go('detail', p.id);
}

function viewDetail(){
  const p = curProject();
  if (!p) return '<p class="muted">作品が見つかりません</p>';
  const yarnOpts = db.yarns.map(y =>
    `<option value="${y.id}">${esc(y.name)}${y.color ? ' ' + esc(y.color) : ''}（残り${y.skeins}玉 / ${y.meters}m）</option>`).join('');
  const patOpts = `<option value="">なし</option>` + db.patterns.map(q =>
    `<option value="${q.id}" ${q.id === p.patternId ? 'selected' : ''}>${esc(q.title)}</option>`).join('');
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2>${esc(p.title)}</h2>
      <button class="d" onclick="delProject()">作品を削除</button>
    </div>
    <label>完成日</label>
    <input type="date" value="${esc(p.date)}" onchange="upd('date', this.value)">
    <label>完成写真</label>
    <div class="row">
      ${p.photo ? `<img class="thumb" style="width:120px;height:120px" src="${p.photo}" alt="">` : ''}
      <label class="s" style="cursor:pointer;display:inline-block">写真を選ぶ
        <input type="file" accept="image/*" hidden onchange="setImage('photo', this.files[0])"></label>
    </div>
  </div>

  <div class="card">
    <h2>編み図</h2>
    <label>在庫の編み図から選ぶ</label>
    <select onchange="upd('patternId', this.value); render()">${patOpts}</select>
    <label>編み図の写真</label>
    <div class="row">
      ${p.patternImg ? `<img class="thumb" style="width:120px;height:120px" src="${p.patternImg}" alt="">` : ''}
      <label class="s" style="cursor:pointer;display:inline-block">写真を選ぶ
        <input type="file" accept="image/*" hidden onchange="setImage('patternImg', this.files[0])"></label>
    </div>
    <label>参考URL</label>
    <input value="${esc(p.url)}" placeholder="https://..." onchange="upd('url', this.value)">
    <label>参考にした本</label>
    <input value="${esc(p.book)}" onchange="upd('book', this.value)">
  </div>

  <div class="card">
    <h2>使用した毛糸</h2>
    ${p.usage.map((u, i) => `<div class="row" style="justify-content:space-between">
      <span>${esc(yarnName(u.yarnId))}：${u.skeins}玉 / ${u.meters}m</span>
      <button class="d" onclick="delUsage(${i})">取消</button></div>`).join('') || '<p class="muted">まだありません</p>'}
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    ${db.yarns.length ? `
    <label>在庫から毛糸を選ぶ</label>
    <select id="u_yarn">${yarnOpts}</select>
    <div class="row">
      <label style="flex:1">使用個数（玉）<input id="u_n" type="number" min="0" step="0.5" value="1"></label>
      <label style="flex:1">使用m数<input id="u_m" type="number" min="0" placeholder="空欄なら個数×1玉のm数"></label>
    </div>
    <button class="p" onclick="addUsage()">在庫から減らして記録</button>`
    : '<p class="muted">在庫に毛糸がありません</p>'}
  </div>

  <div class="card">
    <h2>作り方のメモ</h2>
    <textarea rows="5" onchange="upd('method', this.value)">${esc(p.method)}</textarea>
    <h2>ポイントのメモ</h2>
    <textarea rows="4" onchange="upd('points', this.value)">${esc(p.points)}</textarea>
  </div>`;
}

function upd(field, value){
  curProject()[field] = value;
  saveDb();
}
function setImage(field, file){
  if (!file) return;
  shrink(file).then(data => {
    curProject()[field] = data;
    saveDb();
    render();
  }).catch(e => alert(e.message));
}
function addUsage(){
  const p = curProject();
  const y = db.yarns.find(y => y.id === $('u_yarn').value);
  if (!y) { alert('毛糸を選んでください'); return; }
  const n = num('u_n');
  const m = $('u_m').value === '' ? n * y.mPerSkein : num('u_m');
  if ((n > y.skeins || m > y.meters) &&
      !confirm(`在庫より多く使います（在庫 ${y.skeins}玉 / ${y.meters}m）。続けますか？`)) return;
  y.skeins = Math.max(0, y.skeins - n);
  y.meters = Math.max(0, y.meters - m);
  p.usage.push({ yarnId: y.id, skeins: n, meters: m });
  saveDb();
  render();
}
function delUsage(i){
  const p = curProject();
  const [u] = p.usage.splice(i, 1);
  restore(u);
  saveDb();
  render();
}
function delProject(){
  const p = curProject();
  if (!confirm(`「${p.title}」を削除します。使用した毛糸は在庫に戻します。よろしいですか？`)) return;
  p.usage.forEach(restore);
  db.projects = db.projects.filter(x => x !== p);
  saveDb();
  go('projects');
}

/* ---------- 編み図 ---------- */
function viewPatterns(){
  return `
  <div class="card">
    <h2>編み図を作成</h2>
    <input id="pt_title" placeholder="編み図の名前">
    <div class="row">
      <label style="flex:1">毛糸の太さ<select id="pt_weight"><option value="">指定なし</option>${opts(WEIGHTS)}</select></label>
      <label style="flex:1">必要な毛糸（m）<input id="pt_m" type="number" min="0"></label>
    </div>
    <label>ゲージ</label>
    <input id="pt_gauge" placeholder="10cm四方 ○目×○段">
    <label>作り方・編み図の本文</label>
    <textarea id="pt_body" rows="8" placeholder="段ごとの編み方など"></textarea>
    <label>参考URL</label>
    <input id="pt_url" placeholder="https://...">
    <label>参考にした本</label>
    <input id="pt_book">
    <button class="p" onclick="addPattern()">編み図を保存</button>
  </div>
  <div class="card">
    <h2>他の人の編み図を取り込む</h2>
    <p class="muted">書き出されたファイル（.knit.json）を読み込むと、検索やおすすめの対象になります。</p>
    <label class="s" style="cursor:pointer;display:inline-block">ファイルを選ぶ
      <input type="file" accept="application/json,.json" hidden onchange="importPatterns(this.files[0])"></label>
  </div>
  <input placeholder="検索（名前・本文・本など）" value="${esc(patQuery)}"
    oninput="patQuery=this.value; $('plist').innerHTML=patList()">
  <div id="plist">${patList()}</div>`;
}
function patList(){
  const q = patQuery.toLowerCase();
  const list = db.patterns.filter(p => !q || [p.title, p.body, p.book, p.author].join(' ').toLowerCase().includes(q));
  return list.map(p => `<div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>${esc(p.title)}</strong><span class="muted">${p.kind === 'imported' ? '取り込み' : '自作'}</span>
      </div>
      <p class="muted">${esc(p.yarnWeight || '太さ指定なし')} ・ 必要 ${p.needM || '未入力'}m ・ ゲージ ${esc(p.gauge)}${p.author ? ' ・ ' + esc(p.author) : ''}</p>
      ${p.book ? `<p class="muted">参考：${esc(p.book)}</p>` : ''}
      <pre style="white-space:pre-wrap;font-family:inherit;margin:8px 0">${esc(p.body)}</pre>
      ${/^https?:\/\//.test(p.url || '') ? `<p><a href="${esc(p.url)}" target="_blank" rel="noopener">参考URL</a></p>` : ''}
      <div class="row">
        <button class="s" onclick="exportPattern('${p.id}')">公開用ファイルを書き出す</button>
        <button class="d" onclick="delPattern('${p.id}')">削除</button>
      </div>
    </div>`).join('') || '<p class="muted">該当する編み図がありません</p>';
}
function addPattern(){
  const title = val('pt_title');
  if (!title) { alert('名前を入力してください'); return; }
  db.patterns.push({ id: uid(), kind: 'own', title, yarnWeight: val('pt_weight'), needM: num('pt_m'),
    gauge: val('pt_gauge'), body: val('pt_body'), url: val('pt_url'), book: val('pt_book'), author: '' });
  saveDb();
  render();
}
function exportPattern(id){
  const { id: _id, kind, ...data } = db.patterns.find(p => p.id === id);
  const blob = new Blob([JSON.stringify({ format: 'knit-pattern', version: 1, pattern: data }, null, 2)],
    { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${data.title}.knit.json`;
  a.click();
}
async function importPatterns(file){
  if (!file) return;
  try {
    const json = JSON.parse(await file.text());
    if (json.format !== 'knit-pattern' || !json.pattern?.title) throw new Error('編み図ファイルではありません');
    const p = { ...json.pattern, id: uid(), kind: 'imported' };
    db.patterns.push(p);
    saveDb();
    render();
    alert(`「${p.title}」を取り込みました`);
  } catch (e) {
    alert('取り込みに失敗しました：' + e.message);
  }
}
function delPattern(id){
  if (!confirm('この編み図を削除しますか？')) return;
  db.patterns = db.patterns.filter(p => p.id !== id);
  saveDb();
  render();
}

/* ---------- おすすめ（ルールベース） ---------- */
function viewSuggest(){
  const rows = db.patterns.map(judge).filter(Boolean);
  const rank = { full: 0, combined: 1, short: 2 };
  rows.sort((a, b) => rank[a.level] - rank[b.level]);
  return `<p class="muted">在庫の毛糸（同じ太さのもの）の残りm数と、編み図の必要m数を比べて判定します。</p>
  ${rows.map(r => `<div class="card">
      <strong>${esc(r.p.title)}</strong> <span class="muted">${esc(r.p.yarnWeight || '太さ指定なし')} ・ 必要 ${r.p.needM}m</span>
      <p>${r.msg}</p>
    </div>`).join('') || '<p class="muted">必要m数を入力した編み図があると、ここにおすすめが出ます</p>'}`;
}
function judge(p){
  if (!p.needM) return null;
  const same = db.yarns.filter(y => !p.yarnWeight || y.weight === p.yarnWeight);
  if (!same.length) return { p, level: 'short', msg: `${esc(p.yarnWeight)}の在庫がありません` };
  const best = same.reduce((a, b) => (b.meters > a.meters ? b : a));
  if (best.meters >= p.needM)
    return { p, level: 'full', msg: `✅ <strong>${esc(best.name)}</strong>だけで編めます（在庫 ${best.meters}m）` };
  const total = same.reduce((s, y) => s + y.meters, 0);
  if (total >= p.needM)
    return { p, level: 'combined', msg: `🧶 同じ太さの毛糸を合わせると編めます（合計 ${total}m）` };
  return { p, level: 'short', msg: `あと ${p.needM - total}m 足りません（在庫 ${total}m）` };
}

/* ---------- 画像を縮小して保存（容量対策） ---------- */
function shrink(file, max = 900){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => reject(new Error('画像を読めませんでした'));
    img.src = url;
  });
}

render();
